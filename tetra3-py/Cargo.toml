[package]
name = "tetra3-py"
version = "0.1.0"
edition = "2024"

[lib]
name = "tetra3_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Alias the core crate so it doesn't conflict with the Python module name
tetra3_core = { path = "../tetra3", package = "tetra3", features = ["python"] }
pyo3 = { version = "0.28.3", features = ["abi3", "abi3-py38"] }
numpy = "0.28"

[features]
default = []
force-32bit-solver = ["tetra3_core/force-32bit-solver"]
