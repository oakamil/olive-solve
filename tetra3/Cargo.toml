[package]
name = "tetra3"
version = "0.1.0"
edition = "2024"

[dependencies]
zip = "0.6"
ndarray = { version = "0.17.1" }
npyz = { version = "0.8", features = ["half"] }
half = "2.3"
kiddo = { version = "4.2.0", features = ["immutable"] }
nalgebra = "0.34.1"
pyo3 = { version = "0.28.3", features = ["abi3", "abi3-py38"], optional = true }
numpy = { version = "0.28", optional = true }

[build-dependencies]
tonic-build = "0.11"
pyo3-build-config = { version = "0.28.2", features = ["resolve-config"] }

[dev-dependencies]
pyo3 = { version = "0.28.2", features = ["auto-initialize"] }
numpy = "0.28"
walkdir = "2.3"
cedar_detect = { git = "https://github.com/smroid/cedar-detect" }
image = "0.25.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
python = ["pyo3", "numpy"]
force-32bit-solver = []

